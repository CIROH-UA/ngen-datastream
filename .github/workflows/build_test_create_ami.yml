name: Build and Test Datastream AMI

on:
  workflow_dispatch:
    inputs:
      datastreamcli_tag:
        description: datastreamcli release tag(e.g. v1.7.4). Blank = latest release.
        type: string
        default: ''
      ds_tag:
        description: awiciroh/datastream tag. Blank = datastreamcli's versions.yml. none = leave it off.
        type: string
        default: ''
      fp_tag:
        description: awiciroh/forcingprocessor tag. Blank = datastreamcli's versions_integrations.yml. none = leave it off.
        type: string
        default: ''
      ngiab_tag:
        description: awiciroh/ciroh-ngen-image tag. Blank = datastreamcli's versions_integrations.yml. none = leave it off.
        type: string
        default: ''
      extra_images:
        description: More images, space separated (e.g. awiciroh/qkrig:2.2.0).
        type: string
        default: ''
      include_forcing_weights:
        description: Copy the v2.2 forcing weights onto the AMI (the forcing datastream needs them).
        type: boolean
        default: true
      ami_name:
        description: Name for the AMI. Blank = ngen-datastream-<date>-run<number>-<attempt>.
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE: arn:aws:iam::879381264451:role/github-actions-terraform-oidc

jobs:
  build-and-test-ami:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # Tags every instance this run launches
      WORKFLOW_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Decide what goes into the AMI
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          DATASTREAMCLI_TAG: ${{ inputs.datastreamcli_tag }}
          DS_TAG: ${{ inputs.ds_tag }}
          FP_TAG: ${{ inputs.fp_tag }}
          NGIAB_TAG: ${{ inputs.ngiab_tag }}
          EXTRA_IMAGES: ${{ inputs.extra_images }}
          AMI_NAME: ${{ inputs.ami_name }}
        run: ./shell/ami/resolve_versions.sh

      - name: Configure AWS credentials
        id: aws
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build AMI
        id: build
        env:
          AMI_NAME: ${{ steps.versions.outputs.ami_name }}
          DATASTREAMCLI_TAG: ${{ steps.versions.outputs.datastreamcli_tag }}
          NGEN_DATASTREAM_COMMIT: ${{ github.sha }}
          DOCKER_IMAGES: ${{ steps.versions.outputs.docker_images }}
          INCLUDE_FORCING_WEIGHTS: ${{ inputs.include_forcing_weights }}
          BUILT_BY: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./shell/ami/create_ami.sh

      # Refreshes the AWS credentials after the build in case the build takes a longer time
      - name: Refresh AWS credentials
        if: always() && steps.aws.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Test AMI
        env:
          AMI_ID: ${{ steps.build.outputs.ami_id }}
          DATASTREAMCLI_TAG: ${{ steps.versions.outputs.datastreamcli_tag }}
          NGEN_DATASTREAM_COMMIT: ${{ github.sha }}
          DOCKER_IMAGES: ${{ steps.versions.outputs.docker_images }}
          INCLUDE_FORCING_WEIGHTS: ${{ inputs.include_forcing_weights }}
        run: ./shell/ami/test_ami.sh

      - name: Print the AMI ID and which datastreams can use it
        env:
          AMI_ID: ${{ steps.build.outputs.ami_id }}
          AMI_NAME: ${{ steps.versions.outputs.ami_name }}
        run: |
          echo "::notice title=AMI ready::$AMI_ID ($AMI_NAME)"
          {
            echo "### AMI ready: \`$AMI_ID\`"
            ./shell/ami/compatibility_report.sh "$AMI_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the AMI because the build or test failed
        if: (failure() || cancelled()) && steps.build.outputs.ami_id != ''
        env:
          AMI_ID: ${{ steps.build.outputs.ami_id }}
        run: ./shell/ami/delete_ami.sh "$AMI_ID"

      # create_ami.sh and test_ami.sh terminate their own instances. This catches
      # any they could not, for example when the run is cancelled mid-build.
      - name: Terminate instances this run left behind
        if: always() && steps.aws.outcome == 'success'
        run: |
          leftover_instance_ids=$(aws ec2 describe-instances \
            --filters "Name=tag:ami-workflow-run,Values=$WORKFLOW_RUN" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          if [ -n "$leftover_instance_ids" ]; then
            echo "Terminating $leftover_instance_ids"
            # shellcheck disable=SC2086  # leftover_instance_ids is a list
            aws ec2 terminate-instances --instance-ids $leftover_instance_ids > /dev/null
          else
            echo "Nothing left behind"
          fi
