name: Build, Test, and Push Datastream AMI
on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build the AMI even if ami_version.yml is unchanged'
        type: boolean
        default: false
      keep_failed_ami:
        description: 'Keep the built AMI even if VPU tests fail (skip auto-deregister)'
        type: boolean
        default: false
      datastream_ami_version:
        description: 'AMI version to build (names the AMI datastream-<version>)'
        type: string
        default: '1.7.1'
      ds_tag:
        description: 'Datastream Docker tag'
        type: string
        default: '1.7.1'
      fp_tag:
        description: 'ForcingProcessor Docker tag'
        type: string
        default: '2.2.1'
      ngiab_tag:
        description: 'NGIAB Docker tag'
        type: string
        default: 'v1.8.0'
  push:
    branches:
      - main
    paths:
      - 'ami_version.yml'
      - '.github/workflows/build_test_create_ami.yml'

# One build at a time, across all refs: concurrent runs would collide on the
# AMI name and on the shared test S3 prefixes. Never cancel a build mid-run.
concurrency:
  group: datastream-ami-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-test-push-ami:
    runs-on: ubuntu-latest
    outputs:
      ds_tag: ${{ steps.changes.outputs.ds_tag }}
      fp_tag: ${{ steps.changes.outputs.fp_tag }}
      ngiab_tag: ${{ steps.changes.outputs.ngiab_tag }}
      ds_ami_version: ${{ steps.changes.outputs.ds_ami_version }}
      build_ds_ami: ${{ steps.changes.outputs.build_ds_ami }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Detect version changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
      
          # Current versions
          CURRENT_DS_AMI=$(yq -r e '."datastream-ami-version"' ami_version.yml)
          DS_TAG=$(yq -r e '.DS_TAG' ami_version.yml)
          FP_TAG=$(yq -r e '.FP_TAG' ami_version.yml)
          NGIAB_TAG=$(yq -r e '.NGIAB_TAG' ami_version.yml)

          # Manual dispatch overrides tags with the inputs (which default to these values);
          # push events keep the ami_version.yml values.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_DS_AMI="${{ inputs.datastream_ami_version }}"
            DS_TAG="${{ inputs.ds_tag }}"
            FP_TAG="${{ inputs.fp_tag }}"
            NGIAB_TAG="${{ inputs.ngiab_tag }}"
          fi
      
          # Ensure previous commit and file exist
          if git rev-parse HEAD~1 >/dev/null 2>&1 && git cat-file -e HEAD~1:ami_version.yml 2>/dev/null; then
            git show HEAD~1:ami_version.yml > previous_versions.yml
          else
            printf "datastream-ami-version: '0.0.0'\n" > previous_versions.yml
          fi
      
          PREVIOUS_DS_AMI=$(yq -r e '."datastream-ami-version"' previous_versions.yml)
      
          # Outputs for AMI change detection
          if [ "${{ inputs.force_build }}" = "true" ] || [ "$CURRENT_DS_AMI" != "$PREVIOUS_DS_AMI" ]; then
            echo "datastream-ami-version changed: $PREVIOUS_DS_AMI -> $CURRENT_DS_AMI"
            echo "build_ds_ami=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ds_ami=false" >> "$GITHUB_OUTPUT"
          fi
          echo "ds_ami_version=$CURRENT_DS_AMI" >> "$GITHUB_OUTPUT"

          # Outputs for tags
          echo "ds_tag=$DS_TAG" >> "$GITHUB_OUTPUT"
          echo "fp_tag=$FP_TAG" >> "$GITHUB_OUTPUT"
          echo "ngiab_tag=$NGIAB_TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region us-east-1        

      - name: Build AMI on AWS (N Virginia)
        if: steps.changes.outputs.build_ds_ami == 'true'
        run: |
          ami_version=""
          DS_TAG="${{ steps.changes.outputs.ds_tag }}"
          FP_TAG="${{ steps.changes.outputs.fp_tag }}"
          NGIAB_TAG="${{ steps.changes.outputs.ngiab_tag }}"
          
          if [ "${{ steps.changes.outputs.build_ds_ami }}" == "true" ]; then
            ami_version=datastream-"${{ steps.changes.outputs.ds_ami_version }}"
          fi
          
          # Pass environment variables to the script
          export AMI_NAME="$ami_version"
          export DS_TAG="$DS_TAG"
          export FP_TAG="$FP_TAG"
          export NGIAB_TAG="$NGIAB_TAG"
          chmod +x shell/create_ami.sh
          ./shell/create_ami.sh
          
  get-ami-info:
    needs: build-test-push-ami
    if: needs.build-test-push-ami.outputs.build_ds_ami == 'true'
    runs-on: ubuntu-latest
    outputs:
      ami_id: ${{ steps.get-ami.outputs.ami_id }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Get AMI ID
        id: get-ami
        run: |
          ami_name="datastream-${{ needs.build-test-push-ami.outputs.ds_ami_version }}"
          ami_id=$(aws ec2 describe-images \
            --owners self \
            --filters "Name=name,Values=$ami_name" \
            --query 'Images[0].ImageId' \
            --output text \
            --region us-east-1)
          echo "ami_id=$ami_id" >> "$GITHUB_OUTPUT"


  test-research-datastream-forcingprocessing:
    needs: [build-test-push-ami, get-ami-info]
    if: needs.build-test-push-ami.outputs.build_ds_ami == 'true' 
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install --upgrade awscli


      - name: Build execution payload
        run: |
          ami_id="${{ needs.get-ami-info.outputs.ami_id }}"
          if [ "$ami_id" == "None" ] || [ -z "$ami_id" ] || [ "$ami_id" == "null" ]; then
            echo "Invalid AMI ID: $ami_id"
            aws ec2 describe-images --owners self --query 'Images[*].[Name,ImageId]' --output table --region us-east-1
            exit 1
          fi
          echo "Using AMI ID: $ami_id"

          # A known-good forcing execution stored by the prod streamcommander (current S3 layout)
          aws s3 cp s3://ciroh-community-ngen-datastream/forcings/v2.2_hydrofabric/ngen.20260209/forcing_short_range/00/metadata/execution.json execution.json

          jq --arg ami "$ami_id" '
            del(.instance_parameters.MaxCount, .instance_parameters.MinCount,
                .instance_parameters.InstanceId, .instance_parameters.KeyName,
                .t0, .ii_s3_object_checked, .retry_attempt, .region)
            | .instance_parameters.ImageId = $ami
            | .instance_parameters.TagSpecifications = [{"ResourceType":"instance","Tags":[{"Key":"Project","Value":"fp_test_git_actions"}]}]
            | .commands |= map(gsub("forcings/v2.2_hydrofabric/ngen.20260209/forcing_short_range/00"; "test/cicd/nrds/short_range/fp"))
          ' execution.json > temp.json
          echo "Payload ready:"
          jq -r '.instance_parameters.ImageId' temp.json

      - name: Start and monitor Step Functions execution
        run: |
          SM_ARN="arn:aws:states:us-east-1:879381264451:stateMachine:nrds_prod_sm"
          execution_arn=$(aws stepfunctions start-execution --state-machine-arn "$SM_ARN" --name fp_test_$(env TZ=US/Eastern date +'%Y%m%d%H%M%S') --input "file://temp.json" --region us-east-1 --query 'executionArn' --output text)
          echo "Execution ARN: $execution_arn"
          status="RUNNING"
          elapsed=0
          # Handle every terminal state (FAILED, TIMED_OUT, ABORTED) and cap the
          # wait so a stuck execution can't spin the runner for 6 hours.
          while [ "$status" = "RUNNING" ] && [ $elapsed -lt 2400 ]; do
            status=$(aws stepfunctions describe-execution --execution-arn "$execution_arn" --region us-east-1 --query 'status' --output text)
            echo "[$elapsed s] $status"
            if [ "$status" = "RUNNING" ]; then sleep 15; elapsed=$((elapsed + 15)); fi
          done
          if [ "$status" != "SUCCEEDED" ]; then
            echo "State machine execution ended as: $status"
            exit 1
          fi
          echo "State machine execution succeeded!"


      - name: Clean up
        if: always()
        run: |
          aws s3 rm --recursive s3://ciroh-community-ngen-datastream/test/cicd/nrds/short_range/fp || echo "No file to delete"


  test-all-vpus:
    needs: [build-test-push-ami, get-ami-info]
    if: needs.build-test-push-ami.outputs.build_ds_ami == 'true' 
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # Continue testing other VPUs even if one fails
      matrix:
        vpu: ["01", "02", "03N", "03S", "03W", "04", "05", "06", "07", "08", "09", "10L", "10U", "11", "12", "13", "14", "15", "16", "17", "18"]    
    env:
      VPU: ${{ matrix.vpu }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          pip install --upgrade awscli


      - name: Build execution payload
        run: |
          ami_id="${{ needs.get-ami-info.outputs.ami_id }}"
          if [ "$ami_id" == "None" ] || [ -z "$ami_id" ] || [ "$ami_id" == "null" ]; then
            echo "Invalid AMI ID: $ami_id"
            aws ec2 describe-images --owners self --query 'Images[*].[Name,ImageId]' --output table --region us-east-1
            exit 1
          fi
          echo "Using AMI ID: $ami_id for VPU ${{ env.VPU }}"

          # Committed known-good cfe-nom execution (VPU_16, current S3 layout) — same
          # payload the orchestration integration test uses.
          PAYLOAD=".github/orchestration-test/test-execution-payload.json"

          jq --arg ami "$ami_id" --arg VPU "${{ env.VPU }}" '
            .instance_parameters.ImageId = $ami
            | .instance_parameters.IamInstanceProfile.Name = "nrds_prod_ec2_profile"
            | .instance_parameters.TagSpecifications = [{"ResourceType":"instance","Tags":[
                {"Key":"Name","Value":("ami_test_VPU_" + $VPU)},
                {"Key":"Project","Value":("fp_test_git_actions_vpu_" + $VPU)},
                {"Key":"AMI_Version","Value":"datastream-${{ needs.build-test-push-ami.outputs.ds_ami_version }}"}]}]
            | .commands |= map(gsub("VPU_16"; "VPU_" + $VPU) | gsub("test/cicd/orchestration-test"; "test/cicd/nrds/short_range/VPU_" + $VPU))
          ' "$PAYLOAD" > temp.json
          echo "Payload ready:"
          jq -r '.commands[0][:220]' temp.json

      - name: Start and monitor Step Functions execution
        id: stepfunction
        run: |
          SM_ARN="arn:aws:states:us-east-1:879381264451:stateMachine:nrds_prod_sm"
          execution_arn=$(aws stepfunctions start-execution --state-machine-arn "$SM_ARN" --name VPU_${{ env.VPU }}_test_$(env TZ=US/Eastern date +'%Y%m%d%H%M%S') --input "file://temp.json" --region us-east-1 --query 'executionArn' --output text)
          echo "Execution ARN: $execution_arn"
          status="RUNNING"
          elapsed=0
          # Handle every terminal state (FAILED, TIMED_OUT, ABORTED) and cap the
          # wait so a stuck execution can't spin the runner for 6 hours.
          while [ "$status" = "RUNNING" ] && [ $elapsed -lt 2400 ]; do
            status=$(aws stepfunctions describe-execution --execution-arn "$execution_arn" --region us-east-1 --query 'status' --output text)
            echo "[$elapsed s] $status"
            if [ "$status" = "RUNNING" ]; then sleep 15; elapsed=$((elapsed + 15)); fi
          done
          if [ "$status" != "SUCCEEDED" ]; then
            echo "State machine execution ended as: $status for VPU ${{ env.VPU }}"
            echo "stepfunction_failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "State machine execution succeeded for VPU ${{ env.VPU }}!"
          echo "stepfunction_failed=false" >> "$GITHUB_OUTPUT"

      - name: Clean up
        if: always()
        run: |
          aws s3 rm --recursive s3://ciroh-community-ngen-datastream/test/cicd/nrds/short_range/VPU_${{ env.VPU }} || echo "No files to delete for VPU ${{ env.VPU }}"



  # Summary job that runs after all VPUs complete
  test-summary:
    runs-on: ubuntu-latest
    needs: [build-test-push-ami, test-all-vpus, get-ami-info]
    if: always() && needs.build-test-push-ami.outputs.build_ds_ami == 'true'
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Check VPU Test Results and Handle AMI
        run: |
          echo "VPU Testing Summary:"
          echo "======================"
          echo "Date: $(date)"
          echo "Total VPUs Tested: 21"
          echo ""
          
          # Check if any VPU tests failed
          # GitHub Actions sets job results in the needs context
          any_failed=false
          
          # Parse the results from the matrix jobs
          echo "Checking individual VPU results..."
          
          # In GitHub Actions, when any job in needs.test-all-vpus fails, 
          # the overall needs.test-all-vpus.result will be 'failure'
          if [ "${{ needs.test-all-vpus.result }}" != "success" ]; then
            any_failed=true
            echo "One or more VPU tests failed"
          else
            echo "All VPU tests passed"
          fi
          
          echo " Check individual job logs above for detailed results"
          echo " All test files have been cleaned up from S3"
          
          # Set output for next step
          echo "any_failed=$any_failed" >> $GITHUB_ENV

      - name: Deregister AMI on any test failure
        if: env.any_failed == 'true' && inputs.keep_failed_ami != true
        run: |
          echo " VPU tests failed - checking for custom AMI to deregister..."
          ami_id="${{ needs.get-ami-info.outputs.ami_id }}"
          ami_to_deregister=$ami_id
          
          if [ "$ami_to_deregister" != "None" ] && [ "$ami_to_deregister" != "" ] && [ "$ami_to_deregister" != "null" ]; then
            echo "Found AMI to deregister: $ami_to_deregister"
            
            ami_name=$(aws ec2 describe-images --image-ids $ami_to_deregister --query 'Images[0].Name' --output text --region us-east-1 2>/dev/null || echo "Unknown")
            echo "AMI Name: $ami_name"
            
            # Get snapshot IDs before deregistering
            echo "Getting snapshot IDs..."
            snapshot_ids=$(aws ec2 describe-images --image-ids $ami_to_deregister --query 'Images[0].BlockDeviceMappings[*].Ebs.SnapshotId' --output text --region us-east-1 2>/dev/null || echo "")
            
            if [ -n "$snapshot_ids" ]; then
              echo "Found snapshots: $snapshot_ids"
            fi
            
            # Deregister AMI
            echo "Deregistering AMI: $ami_to_deregister"
            aws ec2 deregister-image --image-id $ami_to_deregister --region us-east-1
            echo " AMI $ami_to_deregister deregistered successfully"
            
            # Delete associated snapshots
            if [ -n "$snapshot_ids" ]; then
              for snapshot_id in $snapshot_ids; do
                if [ "$snapshot_id" != "None" ] && [ "$snapshot_id" != "" ] && [ "$snapshot_id" != "null" ]; then
                  echo "Deleting snapshot: $snapshot_id"
                  aws ec2 delete-snapshot --snapshot-id $snapshot_id --region us-east-1
                  echo "Snapshot $snapshot_id deleted"
                fi
              done
            else
              echo "No snapshots found to delete"
            fi
            
            echo "  AMI cleanup completed due to test failures"
          else
            echo "No custom AMI found to deregister"
          fi

      - name: Final Summary
        run: |
          echo " Final Results:"
          
          if [ "${{ env.any_failed }}" == "true" ]; then
            echo " OVERALL RESULT: Some VPU tests failed"
            if [ "${{ inputs.keep_failed_ami }}" == "true" ]; then
              echo "  keep_failed_ami was set — AMI kept for debugging despite failures"
            else
              echo "  Custom AMI has been deregistered due to failures"
            fi
            echo " Review failed VPU logs above for troubleshooting"
            exit 1
          else
            echo " OVERALL RESULT: All VPU tests passed successfully"
            echo " Custom AMI is validated and preserved"
            echo " Ready for production deployment"
          fi