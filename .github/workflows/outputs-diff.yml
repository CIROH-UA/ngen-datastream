name: Outputs Diff

# Runs a change to a datastream the way production runs it (short_range, at a chosen date
# and init) and comments on the pull request whether its troute output matches production's
# for the same run. A parameter contribution runs with its merged realization in place of the
# live one. Informational: only an invalid input fails it. Run manually; Outputs Diff Hint
# suggests a run on pull requests that may change a datastream. See docs/nrds/OUTPUTS_DIFF.md.

on:
  workflow_dispatch:
    inputs:
      datastream:    {description: Datastream, type: choice, default: lstm_0, options: [lstm_0, cfe-nom, routing-only]}
      vpu:
        description: VPU (one the datastream runs)
        type: choice
        default: '01'
        options: [all, '01', '02', 03N, 03S, 03W, '04', '05', '06', '07', '08', '09', 10L, 10U, '11', '12', '13', '14', '15', '16', '17', '18']
      contribution:  {description: 'Parameter contribution issue number to simulate instead of the datastream', default: ''}
      baseline_date: {description: 'Baseline YYYYMMDD (blank = yesterday)', default: ''}
      init:          {description: 'Short-range init cycle, 00-23', default: '00'}

permissions: {contents: read, id-token: write, issues: read, pull-requests: write}

env:
  DIFF: python .github/python/outputs_diff.py
  BUCKET: ciroh-community-ngen-datastream

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {targets: '${{ steps.t.outputs.targets }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          DATASTREAM: ${{ inputs.datastream }}
          VPU: ${{ inputs.vpu }}
          CONTRIBUTION: ${{ inputs.contribution }}
        run: |
          if [ -n "$CONTRIBUTION" ]; then
            [[ $CONTRIBUTION =~ ^[0-9]+$ ]] || { echo "::error::contribution must be an issue number"; exit 1; }
            # The issue must be an open parameter contribution.
            WHY=$(gh api "repos/$GITHUB_REPOSITORY/issues/$CONTRIBUTION" --jq 'if .pull_request then "is a pull request"
              elif .state != "open" then "is \(.state)" elif (.title | startswith("[Parameters]") | not)
              then "is not a parameter contribution" else "" end') || WHY="does not exist"
            [ -z "$WHY" ] || { echo "::error::Issue #$CONTRIBUTION $WHY"; exit 1; }
          fi
          pip install -q boto3 pandas pyarrow
          T=$($DIFF targets --datastream "$DATASTREAM" --vpu "$VPU" --contribution "$CONTRIBUTION")
          echo "$T" && echo "targets=$T" >> "$GITHUB_OUTPUT"

  diff:
    name: ${{ matrix.key }}
    needs: plan
    if: needs.plan.outputs.targets != '' && needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    continue-on-error: true  # a failed target is reported as "could not compare"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: {include: '${{ fromJSON(needs.plan.outputs.targets) }}'}
    env:
      KEY: ${{ matrix.key }}
      LABEL: ${{ matrix.label }}
      CONTRIBUTION: ${{ matrix.contribution }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q boto3 pandas pyarrow

      # The Parameter Contribution workflow's own check, which merges the contributed
      # parameters into the live realization.
      - name: Build the contributed realization
        id: build
        if: matrix.contribution != ''
        run: |
          set -o pipefail
          pip install -q -e python \
            'ngen_config[all] @ git+https://github.com/ciroh-ua/ngen-cal@master#egg=ngen_config&subdirectory=python/ngen_conf'
          python -m research_datastream.contribution_parameters check "$CONTRIBUTION" \
            --workdir "$RUNNER_TEMP/work" --out candidate.json --record spec.json | tee build.log
          echo "vpu=$(jq -r .vpu spec.json)" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::879381264451:role/github-actions-terraform-oidc
          aws-region: us-east-1

      - name: Simulate
        id: run
        env:
          DATASTREAM: ${{ matrix.datastream }}
          VPU: ${{ steps.build.outputs.vpu || matrix.vpu }}
          DATE: ${{ inputs.baseline_date }}
          INIT: ${{ inputs.init }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $DIFF run --key "$KEY" --datastream "$DATASTREAM" --vpu "$VPU" --date "$DATE" --init "$INIT" \
            --run-id "$RUN_ID" ${CONTRIBUTION:+--realization candidate.json}

      - name: Compare with production
        run: |
          for side in baseline:prod_prefix test:test_prefix; do
            aws s3 sync "s3://$BUCKET/$(jq -r ".${side#*:}" run_info.json)/ngen-run/outputs/troute/" \
              "${side%%:*}/" --exclude '*' --include '*.parquet' --no-progress
          done
          $DIFF compare --label "$LABEL"

      - name: Note the failure
        if: failure()
        env:
          STEP: >-
            ${{ steps.build.outcome == 'failure' && 'building the contributed realization'
             || steps.run.outcome == 'failure' && 'the simulation' || 'the comparison' }}
        run: |
          WHY=$(grep -m1 -F '[FAIL]' build.log 2>/dev/null || true)
          printf '### Outputs diff: %s\n\n❌ Could not compare: failed at %s%s.\n' \
            "$LABEL" "$STEP" "${WHY:+ ($WHY)}" > comment.md

      - name: Comment on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo -e "\n<sub>[run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" \
            "· informational only</sub>" >> comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          PR=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          [ -z "$PR" ] || gh pr comment "$PR" --body-file comment.md

      # The prefix carries the run id, so this never touches production data.
      - name: Clean up
        if: always()
        run: |
          PFX=$(jq -re .test_prefix run_info.json 2>/dev/null) || exit 0
          [[ $PFX == test/outputs_diff/* ]] && aws s3 rm --recursive "s3://$BUCKET/$PFX/" --only-show-errors
