[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research_datastream_core"
version = "0.1.0"
description = "Deployment-agnostic core logic shared by the NextGen Research DataStream orchestrators (AWS Lambdas + LXD controller)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
# Stdlib only — must stay importable both inside an AWS Lambda zip and on the
# LXD controller without pulling extra wheels.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
